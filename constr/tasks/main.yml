---
# tasks file for constr
- name: install packages
  apt: name{{item}} state=latest
  with_items:
       - default-jdk
       - maven
       - git

- name: git clone
  git:
   repo: https://github.com/boxfuse/boxfuse-sample-java-war-hello.git
   dest: dest={{ dest_folder }}

- name: build
  command: mvn package
  args:
   chdir: dest={{ dest_folder }}
